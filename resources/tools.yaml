# 工具定义文件
# 所有 Agent 可用工具的 Schema 定义

tools:
  # ==================== 文件工具 ====================

  - name: create_file
    description: "在指定目录创建一个文本文件"
    parameters:
      - name: directory
        type: string
        description: "目标目录路径,例如: E:/test"
        required: true
      - name: filename
        type: string
        description: "文件名,例如: hello.txt"
        required: true
      - name: content
        type: string
        description: "文件内容,如果未指定则创建空文件"
        required: false

  - name: view_file
    description: "读取文件的完整内容。直接使用 Qt 的文件 API 读取，自动处理 UTF-8 编码，比执行 cat 命令更可靠。返回文件路径、大小、行数和完整内容。"
    parameters:
      - name: file_path
        type: string
        description: "要读取的文件的绝对路径，例如: F:/Documents/test.md 或 /e/Documents/test.md (MSYS格式也支持)"
        required: true

  - name: read_file_lines
    description: "读取文件的指定行范围。适用于查看大文件的特定部分。行号从 1 开始，结果包含行号前缀方便定位。"
    parameters:
      - name: file_path
        type: string
        description: "要读取的文件的绝对路径"
        required: true
      - name: start_line
        type: integer
        description: "起始行号 (从 1 开始)"
        required: true
      - name: end_line
        type: integer
        description: "结束行号 (包含该行)"
        required: true

  - name: replace_in_file
    description: "替换文件中的指定内容。使用精确字符串匹配，适合修改代码。"
    parameters:
      - name: file_path
        type: string
        description: "要修改的文件的绝对路径"
        required: true
      - name: target_content
        type: string
        description: "要被替换的原始内容（精确匹配，包含空格和换行）"
        required: true
      - name: replacement_content
        type: string
        description: "替换后的新内容"
        required: true

  - name: delete_file
    description: "删除指定文件。谨慎使用，删除后无法恢复。"
    parameters:
      - name: file_path
        type: string
        description: "要删除的文件的绝对路径"
        required: true

  - name: list_directory
    description: "列出目录中的文件和子目录。返回文件名、类型和大小信息。"
    parameters:
      - name: directory_path
        type: string
        description: "要列出的目录的绝对路径"
        required: true
      - name: recursive
        type: boolean
        description: "是否递归列出子目录（默认 false）"
        required: false

  - name: grep_search
    description: "在文件内容中搜索包含指定文本的行（内容搜索）。返回匹配的文件名、行号和内容。如果只需要按文件名查找文件，请使用 find_by_name。"
    parameters:
      - name: pattern
        type: string
        description: "要搜索的文本或正则表达式"
        required: true
      - name: directory
        type: string
        description: "搜索的目录路径"
        required: true
      - name: file_pattern
        type: string
        description: "文件名模式（如 *.cpp, *.h），默认搜索所有文件"
        required: false

  - name: find_by_name
    description: "按文件名模式搜索文件（文件名搜索）。支持通配符 * 和 ?。如果需要搜索文件内容中的文本，请使用 grep_search。"
    parameters:
      - name: pattern
        type: string
        description: "文件名模式（如 *.cpp, Main*.java, test?.py）"
        required: true
      - name: directory
        type: string
        description: "搜索的目录路径"
        required: true

  - name: insert_content
    description: "在文件的指定行之后插入内容。比替换更精确，适合添加新代码。"
    parameters:
      - name: file_path
        type: string
        description: "要修改的文件的绝对路径"
        required: true
      - name: line_number
        type: integer
        description: "在此行之后插入（行号从 1 开始，0 表示插入到文件开头）"
        required: true
      - name: content
        type: string
        description: "要插入的内容"
        required: true

  - name: multi_replace_in_file
    description: "一次替换文件中多处不连续的内容。比多次调用 replace_in_file 更高效。"
    parameters:
      - name: file_path
        type: string
        description: "要修改的文件的绝对路径"
        required: true
      - name: replacements
        type: array
        description: "替换操作数组，每个元素包含 target_content 和 replacement_content"
        required: true
        items:
          type: object
          properties:
            - name: target_content
              type: string
              description: "要被替换的原始内容"
            - name: replacement_content
              type: string
              description: "替换后的新内容"

  - name: send_file
    description: "将内容保存为文件发送给用户。用户可以点击文件卡片直接打开查看。适用于：代码文件、分析报告、配置文件等较长内容，避免在聊天气泡中显示大段文本。"
    parameters:
      - name: file_name
        type: string
        description: "文件名（含扩展名），例如: report.md, analysis.cpp, config.yaml"
        required: true
      - name: content
        type: string
        description: "文件的完整内容"
        required: true
      - name: description
        type: string
        description: "文件的简短描述（可选，显示在文件卡片中）"
        required: false

  # ==================== Shell 工具 ====================

  - name: execute_command
    description: "执行终端命令并返回结果。可以执行 dir, git, qmake, make, python 等命令。注意：文件读写请优先使用专用文件工具（view_file, create_file 等），而非 cat/echo 命令。同一目的的命令尽量合并为一次调用(例如: pwd && ls -la)。"
    parameters:
      - name: command
        type: string
        description: "要执行的命令,例如: dir, git status, qmake"
        required: true
      - name: working_directory
        type: string
        description: "工作目录 (可选),例如: E:/Document/metagpt_qt-1"
        required: false

  # ==================== 代码解析工具 ====================

  - name: view_file_outline
    description: "解析代码文件，提取所有函数、类、结构体的大纲信息。返回每个代码项的名称、类型和行号范围。适用于快速了解代码结构。"
    parameters:
      - name: file_path
        type: string
        description: "要解析的代码文件的绝对路径（目前仅支持 C++ 文件）"
        required: true

  - name: view_code_item
    description: "查看指定函数或类的完整代码。先用 view_file_outline 获取代码项名称，再用此工具查看具体代码。"
    parameters:
      - name: file_path
        type: string
        description: "代码文件的绝对路径"
        required: true
      - name: item_name
        type: string
        description: "要查看的代码项名称（如 main, MyClass, MyClass::foo）"
        required: true

  # ==================== LSP 智能工具 ====================

  - name: lsp
    description: "执行 LSP 代码智能分析。可用操作：status(查询LSP状态)、goToDefinition(跳转到符号定义)、findReferences(查找符号的所有引用)、hover(获取符号类型信息)、documentSymbol(列出文件中所有符号)、workspaceSymbol(在整个工程中搜索符号名)、goToImplementation(查找接口/虚函数的实现)、incomingCalls(谁调用了这个函数)、outgoingCalls(这个函数调用了谁)。需要先确保 LSP 服务已启动。"
    parameters:
      - name: operation
        type: string
        description: "具体操作, 可选值: status(状态查询), goToDefinition(跳转定义), findReferences(查找引用), hover(悬停提示), documentSymbol(文本符号), workspaceSymbol(全工程符号), goToImplementation(查找实现), incomingCalls(呼入调用链), outgoingCalls(呼出调用链)"
        required: true
      - name: file_path
        type: string
        description: "操作涉及的文件路径 (status 不需要)"
        required: false
      - name: line
        type: integer
        description: "行号 (0-based, status 不需要)"
        required: false
      - name: character
        type: integer
        description: "字符列偏移 (0-based, status 不需要)"
        required: false
      - name: query
        type: string
        description: "搜索关键词 (仅在 workspaceSymbol 操作时使用)"
        required: false

  - name: lsp_install
    description: "安装/下载 LSP 语言服务（目前仅支持 clangd）"
    parameters:
      - name: language
        type: string
        description: "语言标识（默认 cpp）"
        required: false

  # ==================== Web & 搜索工具 ====================

  - name: web_fetch
    description: "获取指定 URL 的网页内容并转换为 Markdown 格式。适用于：已知具体网址需要读取内容的场景。如果不知道该访问哪个网址，请先用 websearch 搜索。"
    parameters:
      - name: url
        type: string
        description: "网页 URL"
        required: true
      - name: format
        type: string
        description: "返回格式 (text/markdown, 默认 markdown)"
        required: false

  - name: websearch
    description: "搜索互联网获取实时信息。适用于：查询天气、新闻、最新技术文档、版本号、API 用法、代码示例等。当你不确定某个事实或需要最新信息时，优先使用此工具。基于 DuckDuckGo，免费无需 API Key。"
    parameters:
      - name: query
        type: string
        description: "搜索关键词，例如 'Qt QNetworkAccessManager post example'"
        required: true

  # ==================== 记忆工具 ====================

  - name: memory_search
    description: "搜索助手记忆文档（memory.md / user_view.md / daily memory）。默认检索当前助手自身记忆。"
    parameters:
      - name: query
        type: string
        description: "检索关键词"
        required: true
      - name: scope
        type: string
        description: "检索范围：self(默认) / all。self 会使用当前助手 ID。"
        required: false
      - name: agent_id
        type: string
        description: "指定助手 ID（scope=self 且系统无法推断时可显式传入）"
        required: false
      - name: include_daily
        type: boolean
        description: "是否包含 daily 记忆日志（默认 true）"
        required: false
      - name: max_results
        type: integer
        description: "最多返回命中条数（默认 10，范围 1-100）"
        required: false
      - name: max_snippet_chars
        type: integer
        description: "每条命中摘要最大长度（默认 180）"
        required: false

  - name: memory_reindex
    description: "重建助手记忆检索索引（SQLite FTS 派生索引）。可用于索引损坏、迁移后重建或手动刷新。"
    parameters:
      - name: scope
        type: string
        description: "重建范围：self(默认) / all。self 会使用当前助手 ID。"
        required: false
      - name: agent_id
        type: string
        description: "指定助手 ID（scope=self 且系统无法推断时可显式传入）"
        required: false

  - name: memory_write
    description: "主动写入当前助手的长期记忆（memory.md）。仅适合稳定、长期有价值的信息，不要把临时进度或一次性状态写进去。"
    parameters:
      - name: memory
        type: string
        description: "要写入长期记忆的内容"
        required: true
      - name: reason
        type: string
        description: "写入原因（可选，用于审计说明）"
        required: false

  - name: session_search
    description: "检索会话历史（messages.jsonl）。用于找回未进入 memory.md 的旧对话事实。默认检索当前助手相关会话。"
    parameters:
      - name: query
        type: string
        description: "检索关键词"
        required: true
      - name: scope
        type: string
        description: "检索范围：self(默认) / all。self 会使用当前助手 ID。"
        required: false
      - name: agent_id
        type: string
        description: "指定助手 ID（scope=self 且系统无法推断时可显式传入）"
        required: false
      - name: session_id
        type: string
        description: "指定会话 ID，仅在该会话中检索"
        required: false
      - name: include_tool_messages
        type: boolean
        description: "是否包含 tool_call/tool_result 消息（默认 false）"
        required: false
      - name: max_results
        type: integer
        description: "最多返回命中条数（默认 20，范围 1-200）"
        required: false
      - name: max_snippet_chars
        type: integer
        description: "每条命中摘要最大长度（默认 220）"
        required: false

  - name: event_log
    description: "日志查询。通过 action 选择操作: search(检索日志,默认)、sessions(列出会话)、agents(查询Agent)。不确定参数时直接调用，返回结果会包含可用参数提示。建议先用 sessions 查看可用会话，再用 search 按 session_id 检索。"
    parameters:
      - name: action
        type: string
        description: "操作: search(默认) / sessions / agents"
        required: false

  # ==================== 重构工具 ====================

  - name: apply_patch
    description: "应用结构化补丁 (Patch)。支持同时对多个文件执行 Add, Delete, Move, Update 操作。这是重构和大规模修改的首选工具。"
    parameters:
      - name: patchText
        type: string
        description: "完整的补丁文本，必须以 '*** Begin Patch' 开始"
        required: true
